<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="הכירו את לומינה - הפלטפורמה החברתית-תרבותית המובילה לגיל 65+ בישראל. למדו על הסיפור שלנו, החזון, הערכים והצוות המסור שעובד עבורכם.">
    <title>אודות | לומינה - רשת פעילות לגיל 65+</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== RESET & BASE ===== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #fafafa;
            color: #2c2c2c;
            line-height: 1.8;
            font-size: 18px;
        }

        /* ===== NAV ===== */
        .main-nav {
            background: linear-gradient(135deg, #6a3fa0, #9b59b6);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
        }

        .logo {
            font-size: 1.7rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .logo:hover {
            color: #f0e0ff;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links li a {
            color: #f0e0ff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 22px;
            transition: background 0.25s, color 0.25s;
        }

        .nav-links li a:hover,
        .nav-links li a[href="about.html"] {
            background: rgba(255,255,255,0.22);
            color: #fff;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: 2px solid #fff;
            color: #fff;
            font-size: 1.5rem;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 12px 0 16px;
                gap: 4px;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-container {
                flex-wrap: wrap;
            }
        }

        /* ===== HERO SECTION ===== */
        .about-hero {
            background: linear-gradient(135deg, #6a3fa0 0%, #9b59b6 50%, #c39bd3 100%);
            color: #fff;
            text-align: center;
            padding: 90px 24px 80px;
            position: relative;
            overflow: hidden;
        }

        .about-hero::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(255,255,255,0.07);
            top: -200px;
            left: -100px;
        }

        .about-hero::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            bottom: -120px;
            right: -80px;
        }

        .about-hero-content {
            position: relative;
            z-index: 1;
            max-width: 760px;
            margin: 0 auto;
        }

        .about-hero-badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 30px;
            margin-bottom: 22px;
            letter-spacing: 1px;
        }

        .about-hero h1 {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            margin-bottom: 18px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .about-hero p {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            opacity: 0.92;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.9;
        }

        /* ===== GENERAL SECTION ===== */
        .section {
            padding: 80px 24px;
        }

        .section-inner {
            max-width: 1050px;
            margin: 0 auto;
        }

        .section-label {
            display: inline-block;
            background: #f3e8ff;
            color: #6a3fa0;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 5px 16px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(1.6rem, 3.5vw, 2.4rem);
            font-weight: 900;
            color: #3d1a6e;
            margin-bottom: 18px;
            line-height: 1.3;
        }

        .section-text {
            font-size: 1.05rem;
            color: #444;
            line-height: 1.9;
            max-width: 760px;
        }

        /* ===== STORY SECTION ===== */
        .story-section {
            background: #fff;
        }

        .story-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .story-image-block {
            background: linear-gradient(135deg, #f3e8ff, #e8d5ff);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(106,63,160,0.12);
        }

        .story-emoji {
            font-size: 5rem;
            display: block;
            margin-bottom: 20px;
        }

        .story-image-block h3 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #6a3fa0;
            margin-bottom: 10px;
        }

        .story-image-block p {
            font-size: 1rem;
            color: #5a3d7a;
            line-height: 1.8;
        }

        .story-quote {
            border-right: 4px solid #9b59b6;
            padding-right: 20px;
            margin: 26px 0;
            font-size: 1.1rem;
            font-style: italic;
            color: #5a3d7a;
            line-height: 1.8;
        }

        @media (max-width: 750px) {
            .story-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
        }

        /* ===== VISION & MISSION ===== */
        .vision-section {
            background: linear-gradient(135deg, #f9f4ff, #f0e8ff);
        }

        .vision-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 40px;
        }

        .vision-card {
            background: #fff;
            border-radius: 20px;
            padding: 38px 32px;
            box-shadow: 0 6px 24px rgba(106,63,160,0.1);
            border-top: 5px solid #9b59b6;
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .vision-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 36px rgba(106,63,160,0.18);
        }

        .vision-card:nth-child(2) {
            border-top-color: #e74c8b;
        }

        .vision-card-icon {
            font-size: 2.8rem;
            margin-bottom: 16px;
            display: block;
        }

        .vision-card h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #3d1a6e;
            margin-bottom: 12px;
        }

        .vision-card p {
            font-size: 1rem;
            color: #555;
            line-height: 1.85;
        }

        @media (max-width: 650px) {
            .vision-cards {
                grid-template-columns: 1fr;
            }
        }

        /* ===== VALUES ===== */
        .values-section {
            background: #fff;
        }

        .values-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 42px;
        }

        .value-card {
            background: linear-gradient(135deg, #f9f4ff, #f3e8ff);
            border-radius: 20px;
            padding: 36px 26px;
            text-align: center;
            border: 2px solid transparent;
            transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s;
            cursor: default;
        }

        .value-card:hover {
            border-color: #9b59b6;
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(106,63,160,0.14);
        }

        .value-icon {
            font-size: 3rem;
            margin-bottom: 14px;
            display: block;
        }

        .value-card h3 {
            font-size: 1.2rem;
            font-weight: 800;
            color: #3d1a6e;
            margin-bottom: 10px;
        }

        .value-card p {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.75;
        }

        /* ===== TEAM ===== */
        .team-section {
            background: linear-gradient(135deg, #3d1a6e, #6a3fa0);
            color: #fff;
        }

        .team-section .section-title {
            color: #fff;
        }

        .team-section .section-text {
            color: rgba(255,255,255,0.85);
        }

        .team-section .section-label {
            background: rgba(255,255,255,0.18);
            color: #f0e0ff;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 28px;
            margin-top: 44px;
        }

        .team-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 22px;
            padding: 40px 28px;
            text-align: center;
            transition: background 0.25s, transform 0.25s;
        }

        .team-card:hover {
            background: rgba(255,255,255,0.18);
            transform: translateY(-5px);
        }

        .team-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f3e8ff, #e0c3ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 18px;
            border: 3px solid rgba(255,255,255,0.4);
        }

        .team-card h3 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .team-card .team-role {
            font-size: 0.95rem;
            color: #d4a8ff;
            font-weight: 700;
            margin-bottom: 14px;
            display: block;
        }

        .team-card p {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.82);
            line-height: 1.75;
        }

        /* ===== STATS ===== */
        .stats-section {
            background: #fff;
        }

        .stats-intro {
            text-align: center;
            margin-bottom: 54px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 24px;
            margin-bottom: 54px;
        }

        .stat-card {
            background: linear-gradient(135deg, #6a3fa0, #9b59b6);
            color: #fff;
            border-radius: 22px;
            padding: 38px 20px;
            text-align: center;
            box-shadow: 0 8px 26px rgba(106,63,160,0.25);
            transition: transform 0.25s, box-shadow 0.25s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 36px rgba(106,63,160,0.35);
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #e74c8b, #ff6fa8);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #2980b9, #5dade2);
        }

        .stat-card:nth-child(4) {
            background: linear-gradient(135deg, #1abc9c, #48c9b0);
        }

        .stat-number {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            font-weight: 900;
            display: block;
            margin-bottom: 8px;
            line-height: 1;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 600;
        }

        .stats-cta {
            text-align: center;
            background: linear-gradient(135deg, #f9f4ff, #f0e8ff);
            border-radius: 24px;
            padding: 50px 30px;
            box-shadow: 0 4px 20px rgba(106,63,160,0.09);
        }

        .stats-cta h3 {
            font-size: 1.7rem;
            font-weight: 900;
            color: #3d1a6e;
            margin-bottom: 14px;
        }

        .stats-cta p {
            font-size: 1.05rem;
            color: #555;
            margin-bottom: 28px;
        }

        /* ===== BUTTONS ===== */
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #6a3fa0, #9b59b6);
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 16px 38px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            box-shadow: 0 5px 18px rgba(106,63,160,0.3);
            min-width: 200px;
            text-align: center;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5a2d90, #8e44ad);
            transform: translateY(-3px);
            box-shadow: 0 10px 26px rgba(106,63,160,0.4);
        }

        .btn-secondary {
            display: inline-block;
            background: transparent;
            color: #6a3fa0;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 15px 34px;
            border-radius: 50px;
            border: 2px solid #9b59b6;
            cursor: pointer;
            transition: all 0.25s;
            min-width: 180px;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #6a3fa0;
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        /* ===== FOOTER ===== */
        .main-footer {
            background: #1a0a30;
            color: #d4
